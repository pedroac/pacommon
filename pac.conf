# pac.conf: the settings that every pac tool shares. Each line below is the default, commented
# out: remove the "#" from a line and change it to change that setting in all the tools at once.
#
# Read from /etc/pac/pac.conf, then ~/.config/pac/pac.conf (or $XDG_CONFIG_HOME/pac/pac.conf),
# then pac.conf in the current folder, each overriding the earlier. Then each tool reads its own
# <tool>.conf the same way, and what is in it wins over what is here.
# A tool that does not have a setting ignores it.

# High contrast: black and white, nothing dimmed. normal or high.
#contrast = normal

# How big text is drawn, from 0.5 to 2.5 times the usual size.
#text_scale = 1.0

# The font for text: a name such as "Sans", or a font file. Each tool has its own default.
#font = Sans

# The language of messages, such as pt_BR. By default the one the system says (LANG).
#language = en

# The icon set: auto (the tool's own choice), theme (the icon theme's), or 0 (none).
# Each tool has its own default.
#icons = auto

# The color scheme, by name: a file <name>.conf in the themes folder (see docs/configuration.md).
#theme = default

# Speak what is on the screen, for a person who cannot see it. yes or no. Only has an effect in a
# tool built with speech support.
#speech = yes

# Use less memory, at the cost of speed or looks. yes or no.
#low_memory = no

# The braille table, for a tool that prints. By default one is chosen from the language.
#braille_table = en-us-g2.ctb
