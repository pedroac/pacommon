# pac.conf: the settings that every pac tool shares. Each line below is the default, commented
# out: remove the "#" from a line and change it to change that setting in all the tools at once.
#
# Read from /etc/pac/pac.conf, then ~/.config/pac/pac.conf (or $XDG_CONFIG_HOME/pac/pac.conf),
# then pac.conf in the current folder, each overriding the earlier. Then each tool reads its own
# <tool>.conf the same way, and what is in it wins over what is here.
# A tool that does not have a setting ignores it.

# High contrast: black and white, nothing dimmed. normal or high.
#contrast = normal

# How big text is drawn, from 0.5 to 2.5 times the usual size.
#text_scale = 1.0

# The smallest and the largest the smallest text may be, for a person who needs larger text (or
# less of it). A number and a unit: mm, in or px (pt and % too), such as 3mm. Wins over
# text_scale and over the resources level; the one thing that wins over these is a screen the text
# would not fit on. A maximum under 2 mm or a minimum over 40 mm is taken as a mistake. Without
# them, the tool's own sizes are not limited.
#text_size_min = 3mm
#text_size_max = 12mm

# The font for text: a name such as "Sans", or a font file. Each tool has its own default.
#font = Sans

# The language of messages, such as pt_BR. By default the one the system says (LANG).
#language = en

# The icon set: auto (the tool's own choice), theme (the icon theme's), or 0 (none).
# Each tool has its own default.
#icons = auto

# The color scheme, by name: a file <name>.conf in the themes folder (see docs/configuration.md).
#theme = default

# Speak what is on the screen, for a person who cannot see it. yes or no. Only has an effect in a
# tool built with speech support.
#speech = yes

# How much memory and work the tool may use: normal, low (fewer extras) or minimal (the least it
# can do, smaller images). Each tool says what each level does. Never changes contrast, speech or
# the text size limits, and never gives up what privacy asks for: a privacy level that needs more
# memory or another program gets it, whatever this says.
#resources = normal

# How much the tool shows, or leaks, about you and the session: normal, medium (keeps other
# programs from the screen), high (hides what is not needed) or paranoid (also hides how long
# the password is). Each level includes the ones before it. Each tool says what each level does.
# Never changes contrast or speech. Wins over resources.
#privacy = normal

# The braille table, for a tool that prints. By default one is chosen from the language.
#braille_table = en-us-g2.ctb
